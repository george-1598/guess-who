name: Keep Supabase awake

# Free Supabase projects pause after ~7 days without activity. One tiny read every
# 3 days keeps the game ready. (GitHub pauses scheduled workflows in repos with no
# commits for 60 days — it emails you; re-enable it from the Actions tab.)
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --output /dev/null --write-out "Supabase answered with HTTP %{http_code}\n" \
            --header "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/rooms?select=id&limit=1"
