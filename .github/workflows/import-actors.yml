name: Import actors

# Run manually from the Actions tab after editing scripts/actors.txt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Look up actors on TMDB
        run: node scripts/import-tmdb.mjs
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}

      - name: Save the updated list to the repo
        run: |
          if git diff --quiet -- public/data/characters.json; then
            echo "The actor list did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/characters.json
          git commit -m "Update actor list from TMDB"
          git push
